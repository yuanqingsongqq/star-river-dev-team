# ==============================================
# 工作流程
# ==============================================
工作流程:
  步骤:
    - 序号: 1
      执行者: orchestrator
      名称: 任务分解
      输出: Kanban 任务卡

    - 序号: 2
      执行者: pm
      名称: 需求分析
      输出: requirement-analysis-*.md

    - 序号: 3
      执行者: designer
      名称: 界面设计
      输出: ui-design-*.md + 设计稿

    - 序号: 4
      执行者: architect
      名称: 架构设计
      输出: architecture-design-*.md + API文档

    - 序号: 5
      执行者: frontend
      名称: 前端开发
      输出: 完整前端代码

    - 序号: 6
      执行者: backend
      名称: 后端开发
      输出: 完整后端代码

    - 序号: 7
      执行者: qa
      名称: 测试验收
      输出: test-plan-*.md + bug-reports/

    - 序号: 8
      执行者: orchestrator
      名称: 结果交付
      输出: 最终交付物

# ==============================================
# 边界规则
# ==============================================
边界规则:
  orchestrator:
    能做: [任务分解, 调度协调, 进度监控]
    不能做: [写代码, 做设计, 架构决策]

  pm:
    能做: [需求分析, 优先级排序, 验收标准]
    不能做: [写代码, 架构设计, UI设计]

  designer:
    能做: [界面设计, 交互设计, 设计系统]
    不能做: [写前端代码, 技术选型, 架构设计]

  architect:
    能做: [架构设计, 技术选型, API设计]
    不能做: [具体功能代码, 需求分析, UI设计]

  frontend:
    能做: [前端开发, 组件开发, API集成]
    不能做: [修改设计稿, 后端逻辑, 数据库设计]

  backend:
    能做: [后端开发, API开发, 数据库开发]
    不能做: [前端界面, UI设计, 设计决策]

  qa:
    能做: [测试策略, Bug分析, 质量评估]
    不能做: [功能代码, 需求决策, 架构设计]

# ==============================================
# 模型配置说明
# ==============================================
模型配置:
  claude-fable-5-1:
    用途: 通用任务，理解力强
    适用角色: [orchestrator, pm, designer, qa]

  claude-opus-4-7:
    用途: 复杂推理，深度思考
    适用角色: [architect, backend]

  gpt-5.6-astra:
    用途: 代码生成，高效实现
    适用角色: [frontend]

# ==============================================
# 使用说明
# ==============================================
使用说明:
  切换角色: "hermes chat --profile {profile}"
  查看团队: "cat ~/.hermes/team.yaml"
  切换到指挥官: "hermes chat --profile orchestrator"
